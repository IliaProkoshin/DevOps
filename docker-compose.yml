services:
  backend:
    build:
      context: ./backend
    image: backend:2.0
    container_name: devops-backend
    environment:
      HOST: 0.0.0.0
      PORT: "5001"
      DATA_FILE: /data/data.txt
      DEBUG: "false"
    volumes:
      - backend-data:/data
    networks:
      - devops-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:5001/api/health'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always

  frontend:
    build:
      context: ./frontend
    image: frontend:2.0
    container_name: devops-frontend
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      BACKEND_URL: http://backend:5001
      DEBUG: "false"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - devops-net
    restart: always

networks:
  devops-net:
    driver: bridge

volumes:
  backend-data:
